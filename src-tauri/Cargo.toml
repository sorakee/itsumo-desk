[package]
name = "itsumo-desk"
version = "0.1.0"
description = "A lightweight Live2D desktop companion"
license = "MIT"
repository = "https://github.com/sorakee/itsumo-desk"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "itsumo_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pre-release: pinned exactly, upgrade deliberately.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time"] }
# Native folder and file pickers for character import, opened by the core.
tauri-plugin-dialog = "2"
# Zip import only reads deflate (and stored) entries.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Already in the tree through Tauri; encodes and decodes character-pack URLs.
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
# Already in the tree through Tauri at this version; used directly by `platform/windows`.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
# `platform/` opts back in per block with a SAFETY comment.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
